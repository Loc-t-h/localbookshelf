[project]
name = "localbookshelf"
version = "0.1.0"
description = "A bookshelf view for a folder of books. No reader, no library manager."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "rarfile>=4.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
localbookshelf = "localbookshelf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localbookshelf"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
