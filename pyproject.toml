[project]
name = "localbookshelf"
version = "0.1.0"
description = "A bookshelf view for a folder of books. No reader, no library manager."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn, not [standard]: uvloop, httptools, websockets and PyYAML
    # are pure overhead for a LAN shelf that serves HTTP and polls for scan
    # progress. python-dotenv came in through that extra and is declared below.
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "rarfile>=4.2",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.scripts]
localbookshelf = "localbookshelf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localbookshelf"]

[dependency-groups]
# websockets is for tests/shoot.py, which drives headless Chrome over CDP. It
# used to arrive transitively with uvicorn[standard].
dev = ["pytest>=8.0", "websockets>=12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
